name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests & Generate Coverage
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Cache SPM dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Build for testing
      run: |
        xcodebuild \
          -scheme AstroCarto \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
          -derivedDataPath .build \
          build-for-testing
    
    - name: Run tests with coverage
      run: |
        xcodebuild \
          -scheme AstroCarto \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
          -derivedDataPath .build \
          -enableCodeCoverage YES \
          test-without-building
    
    - name: Generate coverage report
      run: |
        xcrun xccov view --report .build/Logs/Test/*.xcresult > coverage.txt
        cat coverage.txt
    
    - name: Extract coverage percentage
      id: coverage
      run: |
        COVERAGE=$(xcrun xccov view --report .build/Logs/Test/*.xcresult | grep -E "^\s+AstroCarto.app" | awk '{print $2}' | sed 's/%//')
        echo "COVERAGE=$COVERAGE" >> $GITHUB_OUTPUT
        echo "Coverage: $COVERAGE%"
    
    - name: Check coverage threshold
      run: |
        COVERAGE=${{ steps.coverage.outputs.COVERAGE }}
        THRESHOLD=85
        
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
          exit 1
        else
          echo "✅ Coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
        fi
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage.txt
    
    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('coverage.txt', 'utf8');
          const coveragePercent = '${{ steps.coverage.outputs.COVERAGE }}';
          
          const body = `## 📊 Test Coverage Report
          
          **Overall Coverage: ${coveragePercent}%**
          ${coveragePercent >= 85 ? '✅' : '❌'} Target: 85%
          
          <details>
          <summary>Detailed Coverage</summary>
          
          \`\`\`
          ${coverage}
          \`\`\`
          
          </details>
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

  lint:
    name: SwiftLint
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install SwiftLint
      run: brew install swiftlint
      
    - name: Run SwiftLint
      run: swiftlint lint --strict

  package-tests:
    name: Test Swift Packages
    runs-on: macos-14
    strategy:
      matrix:
        package: 
          - Core
          - Networking
          - Storage
          - Auth
          - Payments
          - AI
          - FeatureChat
          - FeatureSettings
          - DesignSystem
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      
    - name: Test ${{ matrix.package }} package
      run: |
        cd Packages/${{ matrix.package }}
        swift test --enable-code-coverage
      
    - name: Generate package coverage
      if: success()
      run: |
        cd Packages/${{ matrix.package }}
        xcrun llvm-cov report \
          .build/debug/${{ matrix.package }}PackageTests.xctest/Contents/MacOS/${{ matrix.package }}PackageTests \
          -instr-profile .build/debug/codecov/default.profdata \
          > coverage-${{ matrix.package }}.txt || true
      
    - name: Upload package coverage
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: package-coverage-${{ matrix.package }}
        path: Packages/${{ matrix.package }}/coverage-${{ matrix.package }}.txt

